<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PYQ Hub | The Reality</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar glass">
        <div class="logo">RANKER'S VAULT</div>
        <div class="score-display">Score: <span id="live-score">0</span></div>
    </nav>

    <div class="main-container">
        <!-- Hero & Login (Dashboard) -->
        <div id="dashboard-section" class="glass-panel">
            <h2>Welcome to your Daily Grind</h2>
            <p>10 Tricky PYQs. <span style="color:#10b981;">+4 for Correct</span> | <span style="color:#ef4444;">-1 for Incorrect</span>.</p>
            <p>No answers will be revealed if you are wrong. Only hints.</p>
            <button class="glow-btn" onclick="startDailyQuiz()">Start Day 1</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="glass-panel hidden">
            <div class="quiz-header">
                <span id="q-counter">Q: 1/10</span>
            </div>
            <h3 id="question-text">Question loading...</h3>
            
            <div id="options-container">
                <!-- Options added by JS -->
            </div>

            <!-- HINT BOX (Hidden by default) -->
            <div id="hint-box" class="hint-glass hidden">
                <p>💡 <strong>Hint:</strong> <span id="hint-text"></span></p>
            </div>

            <button id="next-btn" class="glow-btn hidden" onclick="nextQuestion()">Next Question ➡️</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="glass-panel hidden">
            <h2>Test Completed!</h2>
            <p class="final-score">Total Score: <span id="score-text"></span></p>
            <button class="glow-btn" onclick="location.reload()">Return to Dashboard</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
